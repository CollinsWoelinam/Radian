syntax = "proto3";

package radian.telemetry.v1;

option go_package = "github.com/CollinsWoelinam/Radian/backend/gen/radian/telemetry/v1;telemetryv1";

// ---------------------------------------------------------------------------
// Driver app <-> ingestion service
//
// The vehicle is identified by the authenticated WebSocket session (device JWT),
// never by a field in the payload.
// ---------------------------------------------------------------------------

message LocationPoint {
  // Per-device monotonic counter; lets the server ack and the client prune its buffer.
  int64 seq = 1;
  double latitude = 2;
  double longitude = 3;
  // Device GPS time, Unix epoch milliseconds. The server orders by this, not arrival.
  int64 recorded_at_ms = 4;
  optional float speed_kmh = 5;
  optional float heading_deg = 6;
  // Horizontal accuracy radius in meters. Fixes worse than the server threshold are dropped.
  optional float accuracy_m = 7;
  optional float altitude_m = 8;
  optional int32 battery_pct = 9;
}

message TelemetryBatch {
  repeated LocationPoint points = 1;
  // True when flushing the offline SQLite buffer. Backfill is persisted but
  // not broadcast as "live" unless it is newer than the last known fix.
  bool is_backfill = 2;
}

message Heartbeat {
  int64 client_time_ms = 1;
}

message ClientMessage {
  oneof payload {
    TelemetryBatch batch = 1;
    Heartbeat heartbeat = 2;
    JobStatusUpdate job_status = 3;
  }
}

// Acknowledges every point with seq <= acked_seq as durably queued.
message BatchAck {
  int64 acked_seq = 1;
}

// Server-controlled tracking profile so the fleet's battery/precision tradeoff
// can be tuned without shipping an app update.
message TrackingConfig {
  int32 moving_interval_ms = 1;
  int32 distance_filter_m = 2;
  float max_accuracy_m = 3;
  float stationary_speed_kmh = 4;
}

message ServerMessage {
  oneof payload {
    BatchAck ack = 1;
    TrackingConfig config = 2;
    JobOffer job_offer = 3;
    JobCancelled job_cancelled = 4;
  }
}

// ---------------------------------------------------------------------------
// Dispatch
// ---------------------------------------------------------------------------

message GeoPoint {
  double latitude = 1;
  double longitude = 2;
}

message JobOffer {
  string job_id = 1;
  GeoPoint pickup = 2;
  string pickup_address = 3;
  optional GeoPoint dropoff = 4;
  optional string dropoff_address = 5;
  int32 priority = 6;
  int32 eta_seconds = 7;
  string notes = 8;
  // The offer lapses (and goes to the next driver) at this time, Unix ms.
  int64 expires_at_ms = 9;
  // Human-friendly job number shown as "#1042".
  int64 number = 10;
}

// The dispatcher cancelled a job this vehicle was offered or working on.
message JobCancelled {
  string job_id = 1;
  string reason = 2;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  JOB_STATUS_PENDING = 1;
  JOB_STATUS_ASSIGNED = 2;
  JOB_STATUS_EN_ROUTE_PICKUP = 3;
  JOB_STATUS_ON_SITE = 4;
  JOB_STATUS_EN_ROUTE_DROPOFF = 5;
  JOB_STATUS_COMPLETED = 6;
  JOB_STATUS_CANCELLED = 7;
}

message JobStatusUpdate {
  string job_id = 1;
  JobStatus status = 2;
  int64 occurred_at_ms = 3;
}

// ---------------------------------------------------------------------------
// Broadcast service <-> web dashboard
// ---------------------------------------------------------------------------

enum VehicleStatus {
  VEHICLE_STATUS_UNSPECIFIED = 0;
  VEHICLE_STATUS_OFFLINE = 1;
  VEHICLE_STATUS_IDLE = 2;
  VEHICLE_STATUS_EN_ROUTE = 3;
  VEHICLE_STATUS_ON_JOB = 4;
}

message BoundingBox {
  double min_lon = 1;
  double min_lat = 2;
  double max_lon = 3;
  double max_lat = 4;
}

// Sent whenever the dashboard viewport changes; the server only streams
// vehicles inside the box (plus a margin).
message DashboardSubscribe {
  BoundingBox viewport = 1;
}

message DashboardClientMessage {
  oneof payload {
    DashboardSubscribe subscribe = 1;
  }
}

message VehicleDelta {
  string vehicle_id = 1;
  double latitude = 2;
  double longitude = 3;
  float heading_deg = 4;
  float speed_kmh = 5;
  VehicleStatus status = 6;
  int64 recorded_at_ms = 7;
}

// Coalesced per tick (~1s): at most one delta per vehicle.
message FleetUpdate {
  repeated VehicleDelta deltas = 1;
  // Vehicles that left the viewport or went offline.
  repeated string removed_vehicle_ids = 2;
  int64 server_time_ms = 3;
  // True on the first message after a subscribe: deltas is the full snapshot.
  bool is_snapshot = 4;
}

// Something about a job changed; dashboards refetch the job list.
message JobsChanged {
  repeated string job_ids = 1;
}

// ---------------------------------------------------------------------------
// Geofences
// ---------------------------------------------------------------------------

enum GeofenceKind {
  GEOFENCE_KIND_UNSPECIFIED = 0;
  GEOFENCE_KIND_DEPOT = 1;
  GEOFENCE_KIND_SERVICE_AREA = 2;
  GEOFENCE_KIND_RESTRICTED = 3;
}

// A vehicle crossed a zone boundary (confirmed by consecutive fixes).
message GeofenceEvent {
  int64 id = 1;
  string geofence_id = 2;
  string geofence_name = 3;
  GeofenceKind kind = 4;
  string vehicle_id = 5;
  string license_plate = 6;
  // True on entering the zone, false on leaving it.
  bool entered = 7;
  int64 occurred_at_ms = 8;
  GeoPoint position = 9;
}

// Zones were created or deleted; dashboards (and the geofencer) reload them.
message GeofencesChanged {}

message DashboardServerMessage {
  oneof payload {
    FleetUpdate fleet_update = 1;
    JobsChanged jobs_changed = 2;
    GeofenceEvent geofence_event = 3;
    GeofencesChanged geofences_changed = 4;
  }
}
