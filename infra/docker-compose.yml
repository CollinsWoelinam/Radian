name: radian

services:
  postgres:
    # TimescaleDB + PostGIS in one image
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radian}
      POSTGRES_DB: ${POSTGRES_DB:-radian}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radian} -d ${POSTGRES_DB:-radian}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    # AOF so Streams survive a restart
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  osrm:
    # Road routing for dispatch ETAs and map routes. Data: `make osrm-data`.
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "1000", "/data/ghana-latest.osrm"]
    ports:
      - "${OSRM_PORT:-5001}:5000"   # 5000 is taken by AirPlay on macOS
    volumes:
      - ./osrm:/data:ro
    healthcheck:
      # The image has no curl or wget; bash's /dev/tcp makes the request instead.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /route/v1/driving/-0.2,5.6;-0.19,5.61 HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.1
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-radian}:${POSTGRES_PASSWORD:-radian}@postgres:5432/${POSTGRES_DB:-radian}?sslmode=disable"
      - "up"
    restart: "no"

volumes:
  pgdata:
  redisdata:
